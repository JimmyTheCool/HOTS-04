name: Collect Production Fix Failure Log

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect-production-fix-log.yml'

permissions:
  actions: read
  contents: write

jobs:
  collect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Collect failed workflow log
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reference_analysis/logs
          gh run view 37291831732 --repo "$GITHUB_REPOSITORY" --log-failed \
            > reference_analysis/logs/production_fix_r3_failed.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reference_analysis/logs/production_fix_r3_failed.log
          git commit -m 'Record production workflow patch failure [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
