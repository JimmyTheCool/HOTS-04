name: Build ETC Super Smooth Printable STL R5

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-etc-super-smooth-r5.yml'
      - 'tools/build_etc_super_smooth_blender_r5.py'

permissions:
  actions: read
  contents: write

env:
  BLENDER_VERSION: 3.6.23
  SOURCE_RELEASE_TAG: hots04-photo-posed-as-generated-20261006

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils unzip p7zip-full \
            libx11-6 libxi6 libxrender1 libxfixes3 libxkbcommon0 \
            libsm6 libice6 libgl1 libegl1
          python -m pip install --disable-pip-version-check --quiet \
            numpy==2.2.6 trimesh==4.8.3 scipy==1.15.3 pillow==11.1.0 rtree==1.4.1

      - name: Download photographed-pose ETC source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/etc_source_release" "$RUNNER_TEMP/etc_source_extracted"
          gh release download "$SOURCE_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'HOTS04_Photo_Posed_STLs_Available_So_Far.zip' \
            --dir "$RUNNER_TEMP/etc_source_release"
          unzip -q "$RUNNER_TEMP/etc_source_release/HOTS04_Photo_Posed_STLs_Available_So_Far.zip" \
            -d "$RUNNER_TEMP/etc_source_extracted"
          ETC_SOURCE_STL="$RUNNER_TEMP/etc_source_extracted/HOTS04_Photo_Posed_STLs_Available_So_Far/STL_Photo_Posed_As_Generated/ETC.stl"
          test -s "$ETC_SOURCE_STL"
          echo "ETC_SOURCE_STL=$ETC_SOURCE_STL" >> "$GITHUB_ENV"

      - name: Install Blender
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          ARCHIVE="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          curl --fail --location --retry 5 --retry-delay 5 \
            "https://download.blender.org/release/Blender3.6/${ARCHIVE}" -o "$ARCHIVE"
          tar -xf "$ARCHIVE"
          BLENDER="$RUNNER_TEMP/blender-${BLENDER_VERSION}-linux-x64/blender"
          test -x "$BLENDER"
          echo "BLENDER_EXE=$BLENDER" >> "$GITHUB_ENV"

      - name: Build dense smoothed ETC models
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$RUNNER_TEMP/ETC_Super_Smooth_Build"
          rm -rf "$OUTPUT" && mkdir -p "$OUTPUT"
          "$BLENDER_EXE" --background --factory-startup \
            --python tools/build_etc_super_smooth_blender_r5.py -- \
            --source "$ETC_SOURCE_STL" --output-dir "$OUTPUT" \
            --high-pitch-mm 0.30 --print-pitch-mm 0.38 \
            --high-target-triangles 650000 --print-target-triangles 450000 \
            2>&1 | tee "$OUTPUT/blender_build.log"
          test -s "$OUTPUT/ETC_High_Detail_Super_Smooth.stl"
          test -s "$OUTPUT/ETC_Print_Ready_Smooth.stl"

      - name: Validate topology and flat base
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$RUNNER_TEMP/ETC_Super_Smooth_Build"
          python tools/validate_etc_super_smooth.py \
            --high "$OUTPUT/ETC_High_Detail_Super_Smooth.stl" \
            --print-ready "$OUTPUT/ETC_Print_Ready_Smooth.stl" \
            --report "$OUTPUT/validation.json" | tee "$OUTPUT/validation.log"

      - name: Validate photographed-pose silhouette retention
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$RUNNER_TEMP/HOTS-03-ci"
          git clone --filter=blob:none --sparse --depth 1 --branch chatgpt-stl-builder \
            https://github.com/JimmyTheCool/HOTS-03.git "$TOOLS"
          git -C "$TOOLS" sparse-checkout set ci
          OUTPUT="$RUNNER_TEMP/ETC_Super_Smooth_Build"
          COMPARE="$RUNNER_TEMP/etc_compare"
          mkdir -p "$COMPARE/source" "$COMPARE/high" "$COMPARE/print"
          cp "$ETC_SOURCE_STL" "$COMPARE/source/ETC.stl"
          cp "$OUTPUT/ETC_High_Detail_Super_Smooth.stl" "$COMPARE/high/ETC.stl"
          cp "$OUTPUT/ETC_Print_Ready_Smooth.stl" "$COMPARE/print/ETC.stl"
          python "$TOOLS/ci/compare_stl_silhouette.py" \
            --raw "$COMPARE/source" --repaired "$COMPARE/high" \
            --report-json "$OUTPUT/high_silhouette.json" --report-csv "$OUTPUT/high_silhouette.csv" \
            --image "$OUTPUT/high_silhouette.png" --expected 1 \
            --pixel-mm 0.38 --tolerance-mm 1.45 \
            --minimum-raw-coverage 0.930 --minimum-repaired-coverage 0.850 \
            --minimum-iou 0.775 --maximum-points 900000
          python "$TOOLS/ci/compare_stl_silhouette.py" \
            --raw "$COMPARE/source" --repaired "$COMPARE/print" \
            --report-json "$OUTPUT/print_silhouette.json" --report-csv "$OUTPUT/print_silhouette.csv" \
            --image "$OUTPUT/print_silhouette.png" --expected 1 \
            --pixel-mm 0.45 --tolerance-mm 1.70 \
            --minimum-raw-coverage 0.915 --minimum-repaired-coverage 0.830 \
            --minimum-iou 0.745 --maximum-points 900000

      - name: Create proof sheet
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$RUNNER_TEMP/ETC_Super_Smooth_Build"
          python - "$OUTPUT" "$GITHUB_WORKSPACE" <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import sys
          output, repo = Path(sys.argv[1]), Path(sys.argv[2])
          refs = [repo / f'ETC{i:02d}.jpg' for i in range(1,5)]
          renders = sorted((output/'Previews').glob('ETC_High_Detail_view_*.png'))
          if len(renders) != 4: raise SystemExit(f'Expected four renders, found {len(renders)}')
          images = refs + renders
          labels = [f'Reference {i}' for i in range(1,5)] + [f'Smooth STL {i}' for i in range(1,5)]
          cell, header = 480, 70
          canvas = Image.new('RGB', (cell*4, header+cell*2), 'white')
          draw, font = ImageDraw.Draw(canvas), ImageFont.load_default()
          draw.text((20,20), 'E.T.C. reference pose and physically smoothed STL', fill='black', font=font)
          for idx,(path,label) in enumerate(zip(images,labels)):
              image=Image.open(path).convert('RGB'); image.thumbnail((cell-24,cell-48),Image.Resampling.LANCZOS)
              x0,y0=(idx%4)*cell,header+(idx//4)*cell
              canvas.paste(image,(x0+(cell-image.width)//2,y0+30+(cell-50-image.height)//2))
              draw.text((x0+12,y0+8),label,fill='black',font=font)
          canvas.save(output/'ETC_Pose_and_Smoothness_Proof.jpg',quality=94,subsampling=0)
          PY

      - name: Package files
        id: package
        shell: bash
        run: |
          set -euo pipefail
          BUILD="$RUNNER_TEMP/ETC_Super_Smooth_Build"
          PACKAGE="$RUNNER_TEMP/ETC_Super_High_Quality_Printable_STL"
          mkdir -p "$PACKAGE/01_High_Detail" "$PACKAGE/02_Print_Ready" \
            "$PACKAGE/03_Previews" "$PACKAGE/04_Reference_Photos" "$PACKAGE/Reports"
          cp "$BUILD/ETC_High_Detail_Super_Smooth.stl" "$PACKAGE/01_High_Detail/"
          cp "$BUILD/ETC_Print_Ready_Smooth.stl" "$PACKAGE/02_Print_Ready/"
          cp "$BUILD/Previews"/*.png "$PACKAGE/03_Previews/"
          cp "$BUILD/ETC_Pose_and_Smoothness_Proof.jpg" "$PACKAGE/03_Previews/"
          cp ETC0*.jpg "$PACKAGE/04_Reference_Photos/"
          cp "$BUILD"/*.json "$PACKAGE/Reports/"
          cp "$BUILD"/*.csv "$PACKAGE/Reports/" 2>/dev/null || true
          cp "$BUILD"/*.png "$PACKAGE/Reports/" 2>/dev/null || true
          cp "$BUILD"/*.log "$PACKAGE/Reports/" 2>/dev/null || true
          cat > "$PACKAGE/README_FIRST.txt" <<'EOF'
          E.T.C. HIGH-DETAIL SMOOTH PRINTABLE STL

          01_High_Detail contains the dense recommended model. It uses a connected
          0.30 mm remesh, approximately 650,000 triangles, and physical volume-preserving
          smoothing to eliminate the little block/voxel steps visible in earlier versions.

          02_Print_Ready contains a lighter 450,000-triangle version for general FDM slicing.
          Both are in millimetres, include a flat grounded base, and retain the photographed pose.
          STL stores geometry only; colour and textures must be painted.
          Personal, non-commercial fan use only.
          EOF
          ZIP="$GITHUB_WORKSPACE/ETC_Super_High_Quality_Printable_STL.zip"
          cd "$RUNNER_TEMP" && 7z a -tzip -mx=7 "$ZIP" "$(basename "$PACKAGE")"
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 "$ZIP.sha256")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ETC_Super_High_Quality_Printable_STL_R5
          path: |
            ETC_Super_High_Quality_Printable_STL.zip
            ETC_Super_High_Quality_Printable_STL.zip.sha256
          retention-days: 90
          compression-level: 0

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_PATH: ${{ steps.package.outputs.zip }}
          ZIP_SHA256: ${{ steps.package.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          BUILD="$RUNNER_TEMP/ETC_Super_Smooth_Build"
          TAG="hots04-etc-super-smooth-r5-${GITHUB_RUN_ID}"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          E.T.C. in the HOTS-04 photographed pose, rebuilt as a dense physically smoothed printable mesh.

          The high-detail model uses a connected 0.30 mm remesh with approximately 650,000 triangles and physical volume-preserving smoothing. A lighter print-ready version is included. Both passed topology, flat-base, one-body and silhouette-retention checks.

          ZIP SHA-256: $ZIP_SHA256
          EOF
          gh release create "$TAG" "$ZIP_PATH" "$ZIP_PATH.sha256" \
            "$BUILD/ETC_High_Detail_Super_Smooth.stl#ETC_High_Detail_Super_Smooth.stl" \
            "$BUILD/ETC_Print_Ready_Smooth.stl#ETC_Print_Ready_Smooth.stl" \
            "$BUILD/validation.json#validation.json" \
            "$BUILD/ETC_Pose_and_Smoothness_Proof.jpg#ETC_Pose_and_Smoothness_Proof.jpg" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'E.T.C. high-detail smooth printable STL' --notes-file "$RUNNER_TEMP/notes.md"
