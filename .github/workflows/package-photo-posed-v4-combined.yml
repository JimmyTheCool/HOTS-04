name: Package HOTS-04 Photo-Posed V4 Combined

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-photo-posed-v4-combined.yml'

permissions:
  actions: read
  contents: write

env:
  PRIMARY_RUN_ID: '37349602397'
  APOSTROPHE_RUN_ID: '37349684308'

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Check out HOTS-04
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Wait for both build runs and download every hero artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          wait_for_run() {
            local run_id="$1"
            for attempt in $(seq 1 600); do
              status=$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status --jq '.status')
              echo "run $run_id status: $status"
              if [[ "$status" == "completed" ]]; then return 0; fi
              sleep 15
            done
            echo "Timed out waiting for run $run_id" >&2
            return 1
          }
          wait_for_run "$PRIMARY_RUN_ID"
          wait_for_run "$APOSTROPHE_RUN_ID"
          mkdir -p "$RUNNER_TEMP/parts/primary" "$RUNNER_TEMP/parts/apostrophe"
          gh run download "$PRIMARY_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/parts/primary"
          gh run download "$APOSTROPHE_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/parts/apostrophe"
          find "$RUNNER_TEMP/parts" -maxdepth 4 -type f -printf '%P\n' | sort | head -n 500

      - name: Assemble and validate all 18 corrected heroes
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet trimesh==4.8.3 numpy==2.2.6
          ROOT="$RUNNER_TEMP/HOTS04_Photo_Posed_High_Detail_V4"
          mkdir -p "$ROOT/01_High_Detail_Print_Ready" "$ROOT/02_Robust_Print_Ready" "$ROOT/03_Pose_Proofs" "$ROOT/Reports"
          find "$RUNNER_TEMP/parts" -type f -path '*/HighDetail/*.stl' -exec cp -f {} "$ROOT/01_High_Detail_Print_Ready/" \;
          find "$RUNNER_TEMP/parts" -type f -path '*/Robust/*.stl' -exec cp -f {} "$ROOT/02_Robust_Print_Ready/" \;
          find "$RUNNER_TEMP/parts" -type f \( -name '*_pose_proof.jpg' -o -name '*_reference_masks.jpg' \) -exec cp -f {} "$ROOT/03_Pose_Proofs/" \;
          python - "$RUNNER_TEMP/parts" "$ROOT" <<'PY'
          from __future__ import annotations
          import csv, hashlib, json, re, shutil, sys
          from pathlib import Path
          import numpy as np
          import trimesh

          parts=Path(sys.argv[1]); root=Path(sys.argv[2])
          heroes=['Alarak','Arthas','Blaze','Cho-Gall','Dehaka','ETC','Fenix','Leoric','Lt Morales','Lunara',"Mal'Ganis",'Nova','Ragnaros','Rexxar','Stukov','Tychus','Zagara',"Zul'jin"]
          def safe(v):
              return re.sub(r'_+','_',re.sub(r'[^A-Za-z0-9._-]+','_',v.strip())).strip('_.') or 'hero'
          exact={'Cho-Gall':'ultimate','Dehaka':'mecha','Lt Morales':'ultimate','Rexxar':'base'}
          forbidden=('sit','seated','chair','throne','bench','crouch','kneel')
          rows=[]; failures=[]; pose={}
          for hero in heroes:
              hs=safe(hero)
              reports=list(parts.rglob(f'**/{hs}/photo_pose_quality_summary.json'))
              reports=[p for p in reports if p.is_file()]
              if not reports:
                  failures.append({'hero':hero,'reason':'quality report missing'}); continue
              # Prefer a report that explicitly passed both model validations.
              choices=[]
              for p in reports:
                  try:
                      q=json.loads(p.read_text(encoding='utf-8'))
                      score=int(bool(q.get('high_detail_validation_passed')))+int(bool(q.get('robust_validation_passed')))
                      choices.append((score,p,q))
                  except Exception:
                      continue
              if not choices:
                  failures.append({'hero':hero,'reason':'quality report unreadable'}); continue
              _,report_path,q=max(choices,key=lambda x:x[0]); pose[hero]=q
              target=root/'Reports'/hs; target.mkdir(parents=True,exist_ok=True)
              for item in report_path.parent.iterdir():
                  if item.is_file(): shutil.copy2(item,target/item.name)
              if hero in exact and q.get('skin_key')!=exact[hero]: failures.append({'hero':hero,'reason':f"wrong skin {q.get('skin_key')} != {exact[hero]}"})
              animation=str(q.get('selected_animation') or '').casefold()
              if hero=='Nova' and any(t in animation for t in forbidden): failures.append({'hero':hero,'reason':f'forbidden Nova pose {animation}'})
              if hero=='Cho-Gall' and float(q.get('ground_support_score') or 0)<0.45: failures.append({'hero':hero,'reason':f"Cho-Gall support score {q.get('ground_support_score')}"})
              if not q.get('high_detail_validation_passed'): failures.append({'hero':hero,'reason':'per-hero high-detail validation failed'})
              if not q.get('robust_validation_passed'): failures.append({'hero':hero,'reason':'per-hero robust validation failed'})

          for variant,folder,max_triangles in [('high_detail',root/'01_High_Detail_Print_Ready',1500000),('robust',root/'02_Robust_Print_Ready',500000)]:
              for hero in heroes:
                  f=folder/f'{safe(hero)}.stl'
                  if not f.is_file(): failures.append({'hero':hero,'variant':variant,'reason':'STL missing'}); continue
                  mesh=trimesh.load_mesh(f,force='mesh',process=False)
                  finite=bool(np.isfinite(mesh.vertices).all()); ext=[float(x) for x in mesh.extents]
                  row={'hero':hero,'variant':variant,'file':f.name,'bytes':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest(),'vertices':int(len(mesh.vertices)),'triangles':int(len(mesh.faces)),'watertight':bool(mesh.is_watertight),'winding_consistent':bool(mesh.is_winding_consistent),'finite_coordinates':finite,'volume_mm3':float(abs(mesh.volume)),'x_mm':ext[0],'y_mm':ext[1],'z_mm':ext[2],'connected_bodies':int(mesh.body_count),'min_z_mm':float(mesh.bounds[0,2])}
                  rows.append(row)
                  ok=row['watertight'] and row['winding_consistent'] and finite and row['volume_mm3']>1 and row['connected_bodies']==1 and 100<=row['triangles']<=max_triangles and min(ext)>=2 and max(ext)<=350 and abs(row['min_z_mm'])<=0.2
                  if not ok: failures.append({'hero':hero,'variant':variant,'reason':'independent geometry validation failed','metrics':row})

          validation={'expected_heroes':18,'high_detail_count':len(list((root/'01_High_Detail_Print_Ready').glob('*.stl'))),'robust_count':len(list((root/'02_Robust_Print_Ready').glob('*.stl'))),'passed':not failures,'skin_requirements':exact,'pose_requirements':{'Nova':'not sitting/crouching','Cho-Gall':'ground support >= 0.45'},'failures':failures,'files':rows,'pose_metadata':pose}
          validation['passed']=validation['passed'] and validation['high_detail_count']==18 and validation['robust_count']==18
          (root/'Reports'/'FINAL_VALIDATION.json').write_text(json.dumps(validation,indent=2),encoding='utf-8')
          with (root/'Reports'/'FINAL_MANIFEST.csv').open('w',newline='',encoding='utf-8-sig') as h:
              w=csv.DictWriter(h,fieldnames=list(rows[0].keys()) if rows else ['hero']); w.writeheader(); w.writerows(rows)
          (root/'Reports'/'MISSING_OR_FAILED.json').write_text(json.dumps(failures,indent=2),encoding='utf-8')
          print(json.dumps(validation,indent=2))
          if not validation['passed']: raise SystemExit(1)
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path('reference_analysis/selected_skin_plan.json').read_text(encoding='utf-8'))
          plan['heroes']['Rexxar'].update({'skin_key':'base','directory':'storm_hero_rexxar_base','repository':'HOTS-03','model_path':'storm_hero_rexxar_base/storm_hero_rexxar_base.m3','selection_method':'user correction'})
          plan['heroes']['Lt Morales'].update({'skin_key':'ultimate','directory':'storm_hero_medic_ultimate','repository':'HOTS-03','model_path':'storm_hero_medic_ultimate/storm_hero_medic_ultimate.m3'})
          plan['heroes']['Dehaka'].update({'skin_key':'mecha','directory':'storm_hero_dehaka_mecha','repository':'HOTS-02','model_path':'storm_hero_dehaka_mecha/storm_hero_dehaka_mecha.m3'})
          Path('/tmp/plan.json').write_text(json.dumps(plan,indent=2),encoding='utf-8')
          PY
          cp /tmp/plan.json "$ROOT/Reports/SELECTED_SKIN_PLAN_V4.json"
          cat > "$ROOT/README_FIRST.txt" <<'EOF'
          HOTS-04 PHOTOGRAPHED-POSE HIGH-DETAIL STL COLLECTION V4

          Use 01_High_Detail_Print_Ready for the finest validated models.
          Use 02_Robust_Print_Ready for lighter conservative prints.
          03_Pose_Proofs shows the four-view photographed-pose comparisons.
          Reports records exact skins, animation frames, pose scores and geometry validation.

          User-requested corrections:
          - Cho-Gall: Ultimate skin, standing selection/idle pose, bilateral ground support.
          - Rexxar: base skin instead of the incorrect frost skin.
          - Nova: seated/crouched animations excluded.
          - Lt. Morales: Ultimate skin.
          - Dehaka: Mecha skin.
          - Fine 0.20-0.24 mm watertight remesh with up to 1.5 million triangles.

          STL contains geometry only, not texture colours, transparency or glow. Check support placement in your slicer. Personal non-commercial fan use.
          EOF
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends p7zip-full
          cd "$RUNNER_TEMP"
          ZIP="$GITHUB_WORKSPACE/HOTS04_Photo_Posed_High_Detail_V4.zip"
          7z a -tzip -mx=7 "$ZIP" "$(basename "$ROOT")"
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Upload final corrected ZIP
        uses: actions/upload-artifact@v4
        with:
          name: HOTS04_Photo_Posed_High_Detail_V4_Combined
          path: |
            HOTS04_Photo_Posed_High_Detail_V4.zip
            HOTS04_Photo_Posed_High_Detail_V4.zip.sha256
          retention-days: 90
          compression-level: 0

      - name: Publish final corrected release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="hots04-photo-posed-v4-combined-${GITHUB_RUN_ID}"
          gh release create "$TAG" "${{ steps.assemble.outputs.zip }}" "${{ steps.assemble.outputs.zip }}.sha256" "${{ steps.assemble.outputs.root }}/Reports/FINAL_VALIDATION.json#FINAL_VALIDATION.json" "${{ steps.assemble.outputs.root }}/Reports/FINAL_MANIFEST.csv#FINAL_MANIFEST.csv" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "HOTS-04 photographed-pose high-detail STL collection V4" --notes "All 18 photo-selected heroes, with corrected skins and poses, fine-detail watertight meshes and independent validation."
