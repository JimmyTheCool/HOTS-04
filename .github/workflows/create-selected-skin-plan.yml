name: Create HOTS-04 Selected Skin Plan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'reference_analysis/geometry_verification/Cho-Gall.json'

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create final selected source plan
        run: |
          python tools/create_selected_skin_plan.py \
            --clip reference_analysis/skin_match_clip.json \
            --inventory reference_analysis/inventory.json \
            --geometry-dir reference_analysis/geometry_verification \
            --output reference_analysis/selected_skin_plan.json

      - name: Commit final plan safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reference_analysis/selected_skin_plan.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add final photo-selected skin build plan [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        with:
          name: HOTS04-Selected-Skin-Plan
          path: reference_analysis/selected_skin_plan.json
          retention-days: 90
