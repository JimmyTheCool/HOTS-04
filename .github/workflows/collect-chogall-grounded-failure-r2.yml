name: Collect Grounded Cho-Gall Failure Log R2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'reference_analysis/log_requests/chogall_grounded_failure_request.txt'

permissions:
  actions: read
  contents: write

jobs:
  collect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Save failed run log
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p reference_analysis/logs
          gh run view 37351730689 --repo "$GITHUB_REPOSITORY" --log-failed > reference_analysis/logs/chogall_grounded_failed.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reference_analysis/logs/chogall_grounded_failed.log
          git commit -m 'Record grounded Cho-Gall failure log [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
