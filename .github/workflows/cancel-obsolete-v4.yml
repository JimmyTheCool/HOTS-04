name: Cancel Obsolete Photo-Pose V4 Matrix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-obsolete-v4.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-22.04
    steps:
      - name: Cancel known-obsolete V4 run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/runs/37319349822/cancel" || true
          echo 'Cancellation request sent for V4 run 37319349822.'
