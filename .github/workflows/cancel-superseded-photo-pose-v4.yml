name: Cancel Superseded Photo-Pose V4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-superseded-photo-pose-v4.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel superseded failing matrix run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          gh run cancel 37367787071 --repo "$GITHUB_REPOSITORY"
          exit 0
