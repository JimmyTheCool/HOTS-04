name: Package Available Photo-Posed STLs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-available-photo-posed-stls.yml'

permissions:
  actions: read
  contents: write

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      RELEASE_TAG: hots04-photo-posed-available-20261006
      ARCHIVE_NAME: HOTS04_Photo_Posed_STLs_Available_So_Far.zip
    steps:
      - name: Check out HOTS-04
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Install STL validation libraries
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet \
            numpy==2.2.6 trimesh==4.8.3

      - name: Download every retained photo-posed artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/posed_artifacts"
          python - <<'PY'
          from __future__ import annotations
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import urllib.request
          import zipfile

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          root = Path(os.environ['RUNNER_TEMP']) / 'posed_artifacts'
          root.mkdir(parents=True, exist_ok=True)

          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'HOTS04-photo-pose-packager',
          }

          def fetch_json(url: str) -> dict:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.load(response)

          artifacts = []
          page = 1
          while True:
              data = fetch_json(
                  f'https://api.github.com/repos/{repo}/actions/artifacts?per_page=100&page={page}'
              )
              batch = data.get('artifacts', [])
              artifacts.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          pattern = re.compile(r'(photo[ _-]*pose|photo[ _-]*posed|posed[ _-]*stl)', re.I)
          selected = [
              item for item in artifacts
              if not item.get('expired', False) and pattern.search(str(item.get('name', '')))
          ]
          selected.sort(key=lambda item: str(item.get('created_at', '')))
          print(f'Found {len(selected)} retained photo-pose artifacts out of {len(artifacts)} total artifacts.')

          records = []
          for item in selected:
              artifact_id = int(item['id'])
              name = str(item['name'])
              safe = re.sub(r'[^A-Za-z0-9._-]+', '_', name).strip('_.')
              zip_path = root / f'{artifact_id}_{safe}.zip'
              extract_dir = root / f'artifact_{artifact_id}'
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}/zip',
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(request, timeout=300) as response, zip_path.open('wb') as handle:
                      shutil.copyfileobj(response, handle, length=1024 * 1024)
                  extract_dir.mkdir(parents=True, exist_ok=True)
                  with zipfile.ZipFile(zip_path) as archive:
                      archive.extractall(extract_dir)
                  stl_count = len(list(extract_dir.rglob('*.stl')))
                  records.append({
                      'id': artifact_id,
                      'name': name,
                      'created_at': item.get('created_at'),
                      'updated_at': item.get('updated_at'),
                      'size_in_bytes': item.get('size_in_bytes'),
                      'workflow_run': item.get('workflow_run'),
                      'extract_directory': str(extract_dir),
                      'stl_count': stl_count,
                      'download_status': 'success',
                  })
                  print(f'Downloaded {name}: {stl_count} STL file(s)')
              except Exception as exc:
                  records.append({
                      'id': artifact_id,
                      'name': name,
                      'created_at': item.get('created_at'),
                      'extract_directory': str(extract_dir),
                      'stl_count': 0,
                      'download_status': 'failed',
                      'error': str(exc),
                  })
                  print(f'WARNING: failed to download {name}: {exc}')
              finally:
                  zip_path.unlink(missing_ok=True)

          (root / 'artifact_inventory.json').write_text(
              json.dumps({'matched_artifacts': records}, indent=2), encoding='utf-8'
          )
          if not any(record.get('stl_count', 0) for record in records):
              raise SystemExit('No retained photo-posed STL artifacts contained STL files.')
          PY

      - name: Select and validate the best posed STL for each hero
        id: select
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="$RUNNER_TEMP/HOTS04_Photo_Posed_STLs_Available_So_Far"
          mkdir -p "$PACKAGE/STL" "$PACKAGE/Reports"
          python - "$RUNNER_TEMP/posed_artifacts" "$PACKAGE" <<'PY'
          from __future__ import annotations
          import csv
          from datetime import datetime, timezone
          import hashlib
          import json
          import math
          from pathlib import Path
          import re
          import shutil
          import sys
          import traceback

          import numpy as np
          import trimesh

          artifacts_root = Path(sys.argv[1])
          package = Path(sys.argv[2])
          stl_dir = package / 'STL'
          reports_dir = package / 'Reports'
          inventory = json.loads((artifacts_root / 'artifact_inventory.json').read_text(encoding='utf-8'))
          artifact_by_dir = {
              Path(item['extract_directory']).resolve(): item
              for item in inventory['matched_artifacts']
              if item.get('download_status') == 'success'
          }

          def safe_hero(stem: str) -> str:
              value = re.sub(r'(?i)(?:_print_ready|_watertight|_robust|_high_detail|_posed)$', '', stem)
              value = re.sub(r'[^A-Za-z0-9._-]+', '_', value).strip('_.')
              return value or 'Hero'

          def variant_rank(path: Path) -> tuple[int, str]:
              lower = path.as_posix().casefold()
              if '/robust/' in lower or 'robust' in path.stem.casefold():
                  return 500, 'robust'
              if 'print_ready' in lower or 'print-ready' in lower or '/01_print_ready' in lower:
                  return 450, 'print-ready'
              if '/highdetail/' in lower or '/high_detail/' in lower:
                  return 300, 'high-detail'
              if '/initial/' in lower:
                  return 200, 'initial'
              if '/raw/' in lower:
                  return 100, 'raw'
              return 150, 'other'

          candidates: dict[str, list[dict]] = {}
          for artifact_dir, artifact in artifact_by_dir.items():
              created = str(artifact.get('created_at') or '')
              for path in artifact_dir.rglob('*'):
                  if not path.is_file() or path.suffix.casefold() != '.stl':
                      continue
                  rank, variant = variant_rank(path)
                  hero = safe_hero(path.stem)
                  candidates.setdefault(hero.casefold(), []).append({
                      'hero': hero,
                      'path': path,
                      'rank': rank,
                      'variant': variant,
                      'created_at': created,
                      'artifact': artifact,
                  })

          rows = []
          rejected = []
          for folded_hero, hero_candidates in sorted(candidates.items()):
              hero_candidates.sort(
                  key=lambda item: (
                      int(item['rank']),
                      str(item['created_at']),
                      int(item['path'].stat().st_size),
                  ),
                  reverse=True,
              )
              chosen = None
              for candidate in hero_candidates:
                  path = candidate['path']
                  validation = {
                      'file': path.name,
                      'source_path': str(path),
                      'variant': candidate['variant'],
                  }
                  try:
                      loaded = trimesh.load(path, force='mesh', process=False)
                      if isinstance(loaded, trimesh.Scene):
                          geometries = [geometry for geometry in loaded.geometry.values()]
                          mesh = trimesh.util.concatenate(geometries)
                      else:
                          mesh = loaded
                      extents = np.asarray(mesh.extents, dtype=float)
                      finite = bool(np.isfinite(mesh.vertices).all() and np.isfinite(extents).all())
                      faces = int(len(mesh.faces))
                      vertices = int(len(mesh.vertices))
                      volume = float(abs(mesh.volume)) if finite else 0.0
                      watertight = bool(mesh.is_watertight)
                      winding = bool(mesh.is_winding_consistent)
                      body_count = int(mesh.body_count)
                      passed = bool(
                          finite
                          and faces >= 100
                          and vertices >= 50
                          and np.all(extents > 0.1)
                          and volume > 1.0
                          and watertight
                          and winding
                          and body_count == 1
                      )
                      validation.update({
                          'passed': passed,
                          'bytes': path.stat().st_size,
                          'vertices': vertices,
                          'triangles': faces,
                          'watertight': watertight,
                          'winding_consistent': winding,
                          'finite_coordinates': finite,
                          'positive_volume_mm3': volume,
                          'x_mm': float(extents[0]),
                          'y_mm': float(extents[1]),
                          'z_mm': float(extents[2]),
                          'connected_bodies': body_count,
                      })
                  except Exception as exc:
                      validation.update({
                          'passed': False,
                          'error': str(exc),
                          'traceback': traceback.format_exc(),
                      })

                  if validation['passed']:
                      chosen = (candidate, validation)
                      break
                  rejected.append({
                      'hero': candidate['hero'],
                      'artifact_name': candidate['artifact'].get('name'),
                      **validation,
                  })

              if chosen is None:
                  continue

              candidate, validation = chosen
              destination_name = f"{candidate['hero']}.stl"
              destination = stl_dir / destination_name
              shutil.copy2(candidate['path'], destination)
              digest = hashlib.sha256(destination.read_bytes()).hexdigest()
              row = {
                  'hero': candidate['hero'],
                  'file': destination_name,
                  'variant': candidate['variant'],
                  'artifact_id': candidate['artifact'].get('id'),
                  'artifact_name': candidate['artifact'].get('name'),
                  'artifact_created_at': candidate['artifact'].get('created_at'),
                  'source_path_inside_artifact': str(candidate['path'].relative_to(Path(candidate['artifact']['extract_directory']))),
                  'bytes': destination.stat().st_size,
                  'sha256': digest,
                  **{key: value for key, value in validation.items() if key not in {'file', 'source_path', 'variant', 'bytes', 'passed'}},
              }
              rows.append(row)

          if not rows:
              raise SystemExit('No photo-posed STL passed strict printable validation.')

          manifest = {
              'created_utc': datetime.now(timezone.utc).isoformat(),
              'description': 'Strictly validated, recoverable photo-posed HOTS-04 STL files available at packaging time.',
              'hero_count': len(rows),
              'selection_policy': [
                  'Only GitHub Actions artifacts whose names identify photo-pose or photo-posed builds were considered.',
                  'Robust or print-ready variants were preferred over high-detail, initial, and raw variants.',
                  'Each included STL had to be watertight, winding-consistent, finite, positive-volume, and one connected body.',
                  'The earlier non-posed V2/T-pose release was not considered.',
              ],
              'files': rows,
          }
          (reports_dir / 'manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          (reports_dir / 'rejected_candidates.json').write_text(json.dumps(rejected, indent=2), encoding='utf-8')
          shutil.copy2(artifacts_root / 'artifact_inventory.json', reports_dir / 'artifact_inventory.json')

          fields = list(rows[0].keys())
          with (reports_dir / 'manifest.csv').open('w', newline='', encoding='utf-8-sig') as handle:
              writer = csv.DictWriter(handle, fieldnames=fields)
              writer.writeheader()
              writer.writerows(rows)

          names = '\n'.join(f"- {row['hero']} ({row['variant']})" for row in rows)
          readme = f'''HOTS-04 PHOTO-POSED STL FILES AVAILABLE SO FAR

This archive contains {len(rows)} recoverable character STL file(s) produced by the
photo-pose pipeline. It does not contain the earlier generic T-pose collection.

The photo-pose pipeline used the selected HOTS game mesh for dimensions and skin
geometry, searched compatible skeletal animation frames, compared the projected
silhouette from four directions with the four supplied JPG views, froze the best
matching pose, and repaired the result for printing.

INCLUDED
{names}

VALIDATION REQUIRED FOR INCLUSION
- watertight mesh
- consistent face winding
- finite coordinates
- positive enclosed volume
- exactly one connected body
- valid non-zero physical dimensions

The Reports folder records the source artifact, checksum, dimensions, triangle count,
and rejected alternatives. STL stores geometry only; game textures, colour, glow,
transparency, particles, and normal-map detail are not embedded.

Inspect orientation and supports in your slicer before printing. These fan models are
for personal, non-commercial use.
'''
          (package / 'README_FIRST.txt').write_text(readme, encoding='utf-8')
          print(json.dumps({'hero_count': len(rows), 'heroes': [row['hero'] for row in rows]}, indent=2))

          output = Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a', encoding='utf-8') as handle:
              handle.write(f"hero_count={len(rows)}\n")
              handle.write('heroes=' + ', '.join(row['hero'] for row in rows) + '\n')
          PY

      - name: Create ZIP and checksum
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="$RUNNER_TEMP/HOTS04_Photo_Posed_STLs_Available_So_Far"
          python - "$PACKAGE" "$GITHUB_WORKSPACE/$ARCHIVE_NAME" <<'PY'
          from pathlib import Path
          import sys
          import zipfile

          source = Path(sys.argv[1])
          target = Path(sys.argv[2])
          with zipfile.ZipFile(target, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=7) as archive:
              for path in sorted(source.rglob('*')):
                  if path.is_file():
                      archive.write(path, Path(source.name) / path.relative_to(source))
          print(f'Created {target} ({target.stat().st_size:,} bytes)')
          PY
          sha256sum "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"

      - name: Upload packaged ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: HOTS04-Photo-Posed-STLs-Available-So-Far
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          retention-days: 90
          compression-level: 0

      - name: Publish downloadable GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Recoverable photo-posed HOTS-04 STL files available so far.

          Included hero count: ${{ steps.select.outputs.hero_count }}
          Included heroes: ${{ steps.select.outputs.heroes }}

          Only strict, watertight, single-body outputs from genuine photo-pose build
          artifacts were included. The earlier generic T-pose V2 release was excluded.
          EOF
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          gh release create "$RELEASE_TAG" \
            "$ARCHIVE_NAME" \
            "$ARCHIVE_NAME.sha256" \
            "$RUNNER_TEMP/HOTS04_Photo_Posed_STLs_Available_So_Far/Reports/manifest.json#manifest.json" \
            "$RUNNER_TEMP/HOTS04_Photo_Posed_STLs_Available_So_Far/Reports/manifest.csv#manifest.csv" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "HOTS-04 photo-posed STL files available so far" \
            --notes-file release-notes.md
