name: Collect Alarak V4 Failure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect-v4-alarak-failure.yml'

permissions:
  actions: read
  contents: write

jobs:
  collect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download failed log and partial artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="reference_analysis/v4_diagnostics/Alarak"
          mkdir -p "$OUT/artifact"
          gh run view 37349602397 --repo "$GITHUB_REPOSITORY" --job 111896797445 --log-failed > "$OUT/failed_job.log" || true
          gh run download 37349602397 --repo "$GITHUB_REPOSITORY" --name photo-posed-v4-01 --dir "$OUT/artifact"
          find "$OUT" -type f -printf '%P\n' | sort > "$OUT/files.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          git commit -m "Add Alarak V4 failure diagnostics [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
