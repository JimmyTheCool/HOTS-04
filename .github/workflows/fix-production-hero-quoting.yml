name: Fix Selected Hero Production Quoting

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-production-hero-quoting.yml'

permissions:
  actions: write
  contents: write

jobs:
  fix:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch matrix hero transport safely
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/build-selected-hero-stls.yml')
          text = path.read_text(encoding='utf-8')
          old_header = '''      - name: Convert selected M3 skins to detailed and print-prepared STL
        shell: bash
        run: |'''
          new_header = '''      - name: Convert selected M3 skins to detailed and print-prepared STL
        shell: bash
        env:
          HERO_LIST: ${{ matrix.heroes }}
        run: |'''
          if old_header not in text:
              raise SystemExit('conversion step header not found')
          text = text.replace(old_header, new_header, 1)
          old_read = "          IFS='|' read -ra HERO_ITEMS <<< '${{ matrix.heroes }}'"
          new_read = "          IFS='|' read -ra HERO_ITEMS <<< \"$HERO_LIST\""
          if old_read not in text:
              raise SystemExit('unsafe hero parsing line not found')
          text = text.replace(old_read, new_read, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff -- .github/workflows/build-selected-hero-stls.yml

      - name: Commit production workflow fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build-selected-hero-stls.yml
          git commit -m 'Make selected hero matrix safe for apostrophes'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Start corrected production build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run build-selected-hero-stls.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
