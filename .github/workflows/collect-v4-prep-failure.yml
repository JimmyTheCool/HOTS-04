name: Collect V4 Preprocessing Failure

on:
  workflow_dispatch:
  push:
    branches: [photo-pose-v4]
    paths:
      - '.github/workflows/collect-v4-prep-failure.yml'

permissions:
  actions: read
  contents: write

jobs:
  collect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: photo-pose-v4
          fetch-depth: 0
      - name: Collect completed failed job log
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reference_analysis/v4_diagnostics
          gh run view 37367107746 --repo "$GITHUB_REPOSITORY" --job 111954807090 --log > reference_analysis/v4_diagnostics/preprocessing_failure.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reference_analysis/v4_diagnostics/preprocessing_failure.log
          git commit -m 'Add V4 preprocessing failure log [skip ci]'
          git pull --rebase origin photo-pose-v4
          git push origin HEAD:photo-pose-v4
