name: Collect V4 Source Failure Logs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/collect-v4-source-failures.yml']
permissions: {actions: read, contents: write}
jobs:
  collect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Collect logs
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          OUT=reference_analysis/v4_diagnostics/source_failures
          mkdir -p "$OUT"
          gh run view 37349602397 --repo "$GITHUB_REPOSITORY" --job 111896797202 --log-failed > "$OUT/Dehaka.log" || true
          gh run view 37349602397 --repo "$GITHUB_REPOSITORY" --job 111896797311 --log-failed > "$OUT/Rexxar.log" || true
          gh run view 37349602397 --repo "$GITHUB_REPOSITORY" --job 111896797390 --log-failed > "$OUT/Fenix.log" || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT"
          git commit -m 'Add V4 source failure logs [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
