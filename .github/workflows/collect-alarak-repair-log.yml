name: Collect Alarak Repair Log
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/collect-alarak-repair-log.yml']
permissions: {actions: read, contents: write}
jobs:
  collect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Commit failed log
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p reference_analysis/v4_diagnostics/Alarak_repair
          gh run view 37352320282 --repo "$GITHUB_REPOSITORY" --job 111905955730 --log-failed > reference_analysis/v4_diagnostics/Alarak_repair/failed.log || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reference_analysis/v4_diagnostics/Alarak_repair/failed.log
          git commit -m 'Add Alarak repair failure log [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
