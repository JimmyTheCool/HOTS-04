name: Import Photo-Pose Smoke R3 Results

on:
  workflow_run:
    workflows: ['Smoke Test Photo-Posed STL V3 R3']
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  import:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download validated Alarak smoke artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/photo-pose-smoke-r3"
          mkdir -p "$root"
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name HOTS04-photo-posed-v3-r3-smoke-Alarak \
            --dir "$root"
          test -f "$root/Reports/Alarak/pose_match.json"
          test -f "$root/Reports/Alarak/photo_pose_quality_summary.json"
          test -f "$root/Reports/Alarak/Alarak_pose_proof.jpg"
          target="reference_analysis/photo_pose_smoke_v3_r3/Alarak"
          rm -rf "$target"
          mkdir -p "$target"
          cp "$root/Reports/Alarak/pose_match.json" "$target/"
          cp "$root/Reports/Alarak/photo_pose_quality_summary.json" "$target/"
          cp "$root/Reports/Alarak/high_detail_validation.json" "$target/"
          cp "$root/Reports/Alarak/robust_validation.json" "$target/"
          cp "$root/Reports/Alarak/raw_to_high_detail.json" "$target/"
          cp "$root/Reports/Alarak/high_detail_to_robust.json" "$target/"
          cp "$root/Reports/Alarak/repair_methods.json" "$target/"
          cp "$root/Reports/Alarak/Alarak_pose_proof.jpg" "$target/"
          cp "$root/Reports/Alarak/Alarak_reference_masks.jpg" "$target/"
          cp "$root/HERO_COMPLETE.txt" "$target/"

      - name: Commit smoke proof and validation reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reference_analysis/photo_pose_smoke_v3_r3
          git commit -m 'Record validated animated-pose STL smoke proof [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
