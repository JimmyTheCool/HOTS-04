name: Run HOTS-04 Reference Analysis

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'tools/build_reference_sheets.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - run: python -m pip install --quiet pillow reportlab

      - name: Generate inventory and PDF
        run: python tools/build_reference_sheets.py

      - name: Commit generated reference analysis
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reference_analysis
          if ! git diff --cached --quiet; then
            git commit -m 'Add HOTS-04 reference analysis [skip ci]'
            git push origin HEAD:main
          fi

      - name: Publish PDF release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="hots04-reference-analysis-${GITHUB_RUN_ID}"
          gh release create "$TAG" \
            reference_analysis/HOTS04_Reference_Sheets.pdf \
            reference_analysis/inventory.csv \
            reference_analysis/inventory.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'HOTS-04 hero reference analysis' \
            --notes 'Multi-angle reference sheets generated from the uploaded hero screenshots.' \
            --prerelease
